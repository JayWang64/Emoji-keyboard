<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Keyboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f0f4ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    user-select: none;
  }

  h1 {
    font-size: 2rem;
    color: #4a3f8a;
    margin-bottom: 12px;
    text-align: center;
  }

  /* ---------- Document Editor ---------- */
  #doc {
    width: 100%;
    max-width: 820px;
    min-height: 180px;
    background: #fff;
    border: 3px solid #c5b8f0;
    border-radius: 16px;
    padding: 20px 24px;
    font-size: 2.5rem;
    line-height: 1.6;
    cursor: text;
    word-wrap: break-word;
    overflow-wrap: break-word;
    box-shadow: 0 4px 20px rgba(100, 80, 200, .12);
    transition: border-color .2s;
    position: relative;
  }
  #doc:focus { outline: none; border-color: #8b6cf6; }
  #doc:empty::before {
    content: "Tap an emoji to start typing!";
    color: #b8aee0;
    pointer-events: none;
    font-size: 1.6rem;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    width: 100%;
    max-width: 820px;
    display: flex;
    gap: 10px;
    margin: 12px 0;
    flex-wrap: wrap;
    justify-content: center;
  }
  .toolbar button {
    padding: 10px 20px;
    border: 2px solid #c5b8f0;
    border-radius: 12px;
    background: #fff;
    color: #5b4a9e;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .toolbar button:hover { background: #ede8ff; transform: scale(1.05); }
  .toolbar button:active { transform: scale(.97); }

  /* ---------- Announcement Banner ---------- */
  #announce {
    width: 100%;
    max-width: 820px;
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    color: #6c5bbf;
    min-height: 44px;
    line-height: 44px;
    margin: 6px 0;
    transition: opacity .25s;
    border-radius: 12px;
    background: #ede8ff;
    padding: 4px 0;
  }

  /* ---------- Category Tabs ---------- */
  .category-tabs {
    width: 100%;
    max-width: 820px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 8px;
  }
  .category-tabs button {
    padding: 8px 16px;
    border: 2px solid transparent;
    border-radius: 20px;
    background: #e0d9f7;
    font-size: .95rem;
    font-weight: 600;
    color: #5b4a9e;
    cursor: pointer;
    transition: all .15s;
  }
  .category-tabs button:hover { background: #d0c5f0; }
  .category-tabs button.active {
    background: #7c5cf5;
    color: #fff;
    border-color: #5a3dd6;
  }

  /* ---------- Emoji Keyboard ---------- */
  #keyboard {
    width: 100%;
    max-width: 820px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
    padding: 16px;
    background: #fff;
    border-radius: 20px;
    border: 3px solid #c5b8f0;
    box-shadow: 0 4px 20px rgba(100, 80, 200, .12);
  }

  .key {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 12px 6px;
    border: 2px solid #e2dcf5;
    border-radius: 16px;
    background: #faf8ff;
    cursor: pointer;
    transition: all .12s;
  }
  .key:hover { background: #ede8ff; transform: scale(1.08); }
  .key:active { transform: scale(.94); background: #d6ccf7; }
  .key .emoji { font-size: 2.4rem; line-height: 1.1; }
  .key .label {
    font-size: .75rem;
    font-weight: 600;
    color: #6c5bbf;
    text-transform: capitalize;
    text-align: center;
    line-height: 1.1;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 600px) {
    #keyboard { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; padding: 10px; }
    .key .emoji { font-size: 2rem; }
    #doc { font-size: 2rem; min-height: 120px; padding: 14px 16px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<h1>Emoji Keyboard</h1>

<!-- Document area -->
<div id="doc" contenteditable="true" aria-label="Emoji document"></div>

<!-- Toolbar -->
<div class="toolbar">
  <button onclick="clearDoc()">Clear</button>
  <button onclick="backspace()">Backspace</button>
  <button onclick="addNewline()">New Line</button>
  <button onclick="addSpace()">Space</button>
  <button onclick="printDoc()">Print</button>
</div>

<!-- Announcement -->
<div id="announce" aria-live="polite"></div>

<!-- Category tabs -->
<div class="category-tabs" id="tabs"></div>

<!-- Keyboard -->
<div id="keyboard"></div>

<script>
// ─── Emoji Data ───
const categories = {
  "Favorites": [
    ["❤️","Heart"],["🥔","Potato"],["🦈","Shark"],["🦫","Beaver"],
    ["🌊","Pond"],["🍞","Bread"],["✂️","Scissors"],["🔥","Fire"],
    ["🪵","Log"],["🌲","Wood"],["⭐","Star"],["🌈","Rainbow"]
  ],
  "Animals": [
    ["🐶","Dog"],["🐱","Cat"],["🐸","Frog"],["🐔","Chicken"],
    ["🐷","Pig"],["🐮","Cow"],["🐴","Horse"],["🐟","Fish"],
    ["🦋","Butterfly"],["🐢","Turtle"],["🐰","Bunny"],["🐻","Bear"],
    ["🦁","Lion"],["🐘","Elephant"],["🦊","Fox"],["🐧","Penguin"],
    ["🦉","Owl"],["🐝","Bee"],["🐛","Bug"],["🐌","Snail"],
    ["🦆","Duck"],["🐳","Whale"],["🦀","Crab"],["🐙","Octopus"]
  ],
  "Food": [
    ["🍎","Apple"],["🍌","Banana"],["🍓","Strawberry"],["🍕","Pizza"],
    ["🍔","Burger"],["🌮","Taco"],["🍩","Donut"],["🍪","Cookie"],
    ["🧁","Cupcake"],["🍰","Cake"],["🍉","Watermelon"],["🥕","Carrot"],
    ["🌽","Corn"],["🍇","Grapes"],["🥑","Avocado"],["🍦","Ice Cream"],
    ["🥞","Pancakes"],["🧀","Cheese"],["🍿","Popcorn"],["🥐","Croissant"]
  ],
  "Nature": [
    ["🌸","Flower"],["🌻","Sunflower"],["🌺","Hibiscus"],["🍀","Clover"],
    ["🌙","Moon"],["☀️","Sun"],["⛅","Cloud"],["🌧️","Rain"],
    ["❄️","Snow"],["⚡","Lightning"],["🍂","Leaf"],["🌵","Cactus"],
    ["🪨","Rock"],["💧","Water Drop"],["🏔️","Mountain"],["🌾","Wheat"]
  ],
  "Faces": [
    ["😀","Happy"],["😂","Laughing"],["🥰","Love Face"],["😎","Cool"],
    ["🤔","Thinking"],["😴","Sleepy"],["😱","Scared"],["🤩","Amazed"],
    ["😋","Yummy"],["🤗","Hug"],["😢","Sad"],["😡","Angry"],
    ["🤪","Silly"],["🥳","Party"],["😇","Angel"],["🤠","Cowboy"]
  ],
  "Things": [
    ["🚗","Car"],["🚀","Rocket"],["✈️","Airplane"],["🚂","Train"],
    ["⚽","Soccer Ball"],["🏀","Basketball"],["🎸","Guitar"],["🎨","Art"],
    ["📚","Books"],["🔔","Bell"],["🎁","Gift"],["🏠","House"],
    ["🎈","Balloon"],["🧸","Teddy Bear"],["🪁","Kite"],["🛴","Scooter"],
    ["🎹","Piano"],["🔑","Key"],["💡","Light Bulb"],["🧲","Magnet"]
  ],
  "Symbols": [
    ["💖","Love"],["✅","Check"],["❌","Cross"],["❓","Question"],
    ["💯","Hundred"],["🎵","Music"],["💤","Sleep"],["💬","Speech"],
    ["👍","Thumbs Up"],["👎","Thumbs Down"],["👋","Wave"],["👏","Clap"],
    ["✌️","Peace"],["🤝","Handshake"],["💪","Strong"],["🙌","Hooray"]
  ]
};

let activeCategory = "Favorites";

// ─── Build UI ───
function buildTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  for (const cat of Object.keys(categories)) {
    const btn = document.createElement("button");
    btn.textContent = cat;
    if (cat === activeCategory) btn.classList.add("active");
    btn.addEventListener("click", () => { activeCategory = cat; buildTabs(); buildKeys(); });
    tabs.appendChild(btn);
  }
}

function buildKeys() {
  const kb = document.getElementById("keyboard");
  kb.innerHTML = "";
  for (const [emoji, name] of categories[activeCategory]) {
    const key = document.createElement("div");
    key.className = "key";
    key.innerHTML = `<span class="emoji">${emoji}</span><span class="label">${name}</span>`;
    key.addEventListener("click", () => typeEmoji(emoji, name));
    kb.appendChild(key);
  }
}

// ─── Core Actions ───
function typeEmoji(emoji, name) {
  const doc = document.getElementById("doc");
  doc.focus();

  // Insert at cursor position (or end)
  const sel = window.getSelection();
  if (sel.rangeCount && doc.contains(sel.anchorNode)) {
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(document.createTextNode(emoji));
    range.collapse(false);
  } else {
    doc.appendChild(document.createTextNode(emoji));
  }

  // Move cursor after inserted emoji
  const s = window.getSelection();
  if (s.rangeCount) { const r = s.getRangeAt(0); r.collapse(false); }

  announce(emoji, name);
}

function announce(emoji, name) {
  const el = document.getElementById("announce");
  el.textContent = `${emoji} ${name}`;

  // Speak it
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(name);
  utter.rate = 0.9;
  utter.pitch = 1.1;
  speechSynthesis.speak(utter);
}

function clearDoc() {
  document.getElementById("doc").innerHTML = "";
  document.getElementById("announce").textContent = "";
}

function backspace() {
  const doc = document.getElementById("doc");
  const text = doc.textContent;
  if (!text.length) return;

  // Remove the last grapheme (handles emoji properly)
  const segments = [...new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(text)];
  segments.pop();
  doc.textContent = segments.map(s => s.segment).join("");

  // Move cursor to end
  const range = document.createRange();
  range.selectNodeContents(doc);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function addNewline() {
  const doc = document.getElementById("doc");
  doc.focus();
  document.execCommand("insertLineBreak");
}

function addSpace() {
  const doc = document.getElementById("doc");
  doc.focus();
  const sel = window.getSelection();
  if (sel.rangeCount && doc.contains(sel.anchorNode)) {
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(document.createTextNode(" "));
    range.collapse(false);
  } else {
    doc.appendChild(document.createTextNode(" "));
  }
}

function printDoc() {
  window.print();
}

// ─── Init ───
buildTabs();
buildKeys();
</script>
</body>
</html>
