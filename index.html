<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Emoji Keyboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f0f4ff;
    user-select: none;
    -webkit-user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 820px;
    margin: 0 auto;
    padding: 8px 8px 0;
  }

  /* ---------- Header ---------- */
  #header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 6px 0;
    flex-shrink: 0;
  }
  #header h1 {
    font-size: 1.3rem;
    color: #4a3f8a;
  }
  #clear-btn {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
    color: #9a8cc4;
    transition: all .15s;
  }
  #clear-btn:hover { background: #ede8ff; color: #6c5bbf; }
  #clear-btn:active { transform: translateY(-50%) scale(.9); }

  /* ---------- Document Canvas ---------- */
  #doc-wrap {
    flex: 0 0 30%;
    min-height: 0;
    background: #fff;
    border: 3px solid #c5b8f0;
    border-radius: 14px;
    overflow-y: auto;
    box-shadow: 0 4px 20px rgba(100, 80, 200, .12);
    -webkit-overflow-scrolling: touch;
  }
  #doc {
    padding: 14px 16px;
    font-size: 2.2rem;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    min-height: 100%;
  }
  #doc:empty::before {
    content: "Tap an emoji to start typing!";
    color: #b8aee0;
    pointer-events: none;
    font-size: 1.3rem;
  }

  /* ---------- Announcement ---------- */
  #announce {
    text-align: center;
    font-size: 1.2rem;
    font-weight: 700;
    color: #6c5bbf;
    height: 32px;
    line-height: 32px;
    flex-shrink: 0;
    margin: 4px 0;
  }

  /* ---------- Quick Actions ---------- */
  #actions {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-shrink: 0;
    margin-bottom: 6px;
  }
  #actions button {
    padding: 6px 16px;
    border: 2px solid #c5b8f0;
    border-radius: 10px;
    background: #fff;
    color: #5b4a9e;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  #actions button:hover { background: #ede8ff; }
  #actions button:active { transform: scale(.95); }

  /* ---------- Keyboard ---------- */
  #keyboard {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    padding: 10px;
    background: #fff;
    border-radius: 16px 16px 0 0;
    border: 3px solid #c5b8f0;
    border-bottom: none;
    align-content: start;
  }

  .key {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 10px 4px;
    border: 2px solid #e2dcf5;
    border-radius: 14px;
    background: #faf8ff;
    cursor: pointer;
    transition: all .12s;
  }
  .key:hover { background: #ede8ff; transform: scale(1.08); }
  .key:active { transform: scale(.92); background: #d6ccf7; }
  .key .emoji { font-size: 2rem; line-height: 1.1; }
  .key .label {
    font-size: .65rem;
    font-weight: 600;
    color: #6c5bbf;
    text-transform: capitalize;
    text-align: center;
    line-height: 1.1;
  }

  /* ---------- Confirm Dialog ---------- */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #overlay.show { display: flex; }
  #dialog {
    background: #fff;
    border-radius: 20px;
    padding: 28px 32px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,.2);
  }
  #dialog p {
    font-size: 1.2rem;
    font-weight: 600;
    color: #4a3f8a;
    margin-bottom: 20px;
  }
  #dialog .btns { display: flex; gap: 12px; justify-content: center; }
  #dialog button {
    padding: 10px 28px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  #dialog .yes { background: #e74c6f; color: #fff; }
  #dialog .yes:hover { background: #d43a5c; }
  #dialog .no { background: #e0d9f7; color: #5b4a9e; }
  #dialog .no:hover { background: #d0c5f0; }
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div id="header">
    <h1>Emoji Keyboard</h1>
    <button id="clear-btn" onclick="showClear()" title="Clear all">🧹</button>
  </div>

  <!-- Document canvas (fixed height, scrollable) -->
  <div id="doc-wrap">
    <div id="doc" aria-label="Emoji document"></div>
  </div>

  <!-- Announcement -->
  <div id="announce" aria-live="polite"></div>

  <!-- Quick action buttons -->
  <div id="actions">
    <button onclick="backspace()">Backspace</button>
    <button onclick="addSpace()">Space</button>
    <button onclick="addNewline()">New Line</button>
  </div>

  <!-- Keyboard (scrollable, fills remaining space) -->
  <div id="keyboard"></div>
</div>

<!-- Confirm clear dialog -->
<div id="overlay">
  <div id="dialog">
    <p>Are you sure?</p>
    <div class="btns">
      <button class="yes" onclick="confirmClear()">Yes</button>
      <button class="no" onclick="cancelClear()">No</button>
    </div>
  </div>
</div>

<script>
// ─── All emojis in one flat list ───
const emojis = [
  ["❤️","Heart"],["🥔","Potato"],["🦈","Shark"],["🦫","Beaver"],
  ["🌊","Pond"],["🍞","Bread"],["✂️","Scissors"],["🔥","Fire"],
  ["🪵","Log"],["🌲","Wood"],["⭐","Star"],["🌈","Rainbow"],
  ["🌍","Earth"],["🌱","Plant"],["🌸","Flower"],["🐜","Ant"],
  ["👦🏻","Theodore"],["🧒🏻","Lincoln"],["👧🏻","Skye"],["👶🏻","Bobby"],
  ["🐶","Dog"],["🐱","Cat"],["🐸","Frog"],["🐔","Chicken"],
  ["🐷","Pig"],["🐮","Cow"],["🐴","Horse"],["🐟","Fish"],
  ["🦋","Butterfly"],["🐢","Turtle"],["🐰","Bunny"],["🐻","Bear"],
  ["🦁","Lion"],["🐘","Elephant"],["🦊","Fox"],["🐧","Penguin"],
  ["🦉","Owl"],["🐝","Bee"],["🐛","Bug"],["🐌","Snail"],
  ["🦆","Duck"],["🐳","Whale"],["🦀","Crab"],["🐙","Octopus"],
  ["🍎","Apple"],["🍌","Banana"],["🍓","Strawberry"],["🍕","Pizza"],
  ["🍔","Burger"],["🌮","Taco"],["🍩","Donut"],["🍪","Cookie"],
  ["🧁","Cupcake"],["🍰","Cake"],["🍉","Watermelon"],["🥕","Carrot"],
  ["🌽","Corn"],["🍇","Grapes"],["🥑","Avocado"],["🍦","Ice Cream"],
  ["🥞","Pancakes"],["🧀","Cheese"],["🍿","Popcorn"],["🥐","Croissant"],
  ["🌻","Sunflower"],["🌺","Hibiscus"],["🍀","Clover"],
  ["🌙","Moon"],["☀️","Sun"],["⛅","Cloud"],["🌧️","Rain"],
  ["❄️","Snow"],["⚡","Lightning"],["🍂","Leaf"],["🌵","Cactus"],
  ["🪨","Rock"],["💧","Water Drop"],["🏔️","Mountain"],["🌾","Wheat"],
  ["😀","Happy"],["😂","Laughing"],["🥰","Love Face"],["😎","Cool"],
  ["🤔","Thinking"],["😴","Sleepy"],["😱","Scared"],["🤩","Amazed"],
  ["😋","Yummy"],["🤗","Hug"],["😢","Sad"],["😡","Angry"],
  ["🤪","Silly"],["🥳","Party"],["😇","Angel"],["🤠","Cowboy"],
  ["🚗","Car"],["🚀","Rocket"],["✈️","Airplane"],["🚂","Train"],
  ["⚽","Soccer Ball"],["🏀","Basketball"],["🎸","Guitar"],["🎨","Art"],
  ["📚","Books"],["🔔","Bell"],["🎁","Gift"],["🏠","House"],
  ["🎈","Balloon"],["🧸","Teddy Bear"],["🪁","Kite"],["🛴","Scooter"],
  ["🎹","Piano"],["🔑","Key"],["💡","Light Bulb"],["🧲","Magnet"],
  ["💖","Love"],["✅","Check"],["❌","Cross"],["❓","Question"],
  ["💯","Hundred"],["🎵","Music"],["💤","Sleep"],["💬","Speech"],
  ["👍","Thumbs Up"],["👎","Thumbs Down"],["👋","Wave"],["👏","Clap"],
  ["✌️","Peace"],["🤝","Handshake"],["💪","Strong"],["🙌","Hooray"]
];

// ─── Build Keyboard ───
const kb = document.getElementById("keyboard");
for (const [emoji, name] of emojis) {
  const key = document.createElement("div");
  key.className = "key";
  key.innerHTML = `<span class="emoji">${emoji}</span><span class="label">${name}</span>`;
  key.addEventListener("click", () => typeEmoji(emoji, name));
  kb.appendChild(key);
}

// ─── Core Actions ───
function typeEmoji(emoji, name) {
  const doc = document.getElementById("doc");
  doc.appendChild(document.createTextNode(emoji));
  // Auto-scroll doc to bottom
  const wrap = document.getElementById("doc-wrap");
  wrap.scrollTop = wrap.scrollHeight;
  announce(emoji, name);
}

function announce(emoji, name) {
  document.getElementById("announce").textContent = `${emoji} ${name}`;
  speechSynthesis.cancel();
  // Short delay after cancel() fixes Chrome desktop silently dropping utterances
  setTimeout(() => {
    const utter = new SpeechSynthesisUtterance(name);
    utter.rate = 0.9;
    utter.pitch = 1.1;
    speechSynthesis.speak(utter);
  }, 50);
}

function showClear() {
  document.getElementById("overlay").classList.add("show");
}
function confirmClear() {
  document.getElementById("doc").innerHTML = "";
  document.getElementById("announce").textContent = "";
  document.getElementById("overlay").classList.remove("show");
}
function cancelClear() {
  document.getElementById("overlay").classList.remove("show");
}

function backspace() {
  const doc = document.getElementById("doc");
  const text = doc.textContent;
  if (!text.length) return;
  const segments = [...new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(text)];
  segments.pop();
  doc.textContent = segments.map(s => s.segment).join("");
}

function addNewline() {
  const doc = document.getElementById("doc");
  doc.appendChild(document.createElement("br"));
  const wrap = document.getElementById("doc-wrap");
  wrap.scrollTop = wrap.scrollHeight;
}

function addSpace() {
  const doc = document.getElementById("doc");
  doc.appendChild(document.createTextNode(" "));
}
</script>
</body>
</html>
